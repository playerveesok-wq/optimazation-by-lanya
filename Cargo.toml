[package]
name = "optima"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
sysinfo = "0.32"
ureq = { version = "2.10", features = ["json"] }
whoami = "1.5"

[build-dependencies]
winres = "0.1"
